name: RF-Lab Watch release APK

# watch-v0.1.0 -> public Watch APK. Never marks the release "latest": the
# current site's Android button uses releases/latest for the phone APK.
on:
  push:
    tags: ["watch-v*"]

permissions:
  contents: write

concurrency:
  group: watch-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Check tag matches watch versionName
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#watch-v}"
          GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' watch/app/build.gradle.kts | head -n1)
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match watch versionName '$GRADLE_VERSION'"
            exit 1
          fi

      - name: Import independent watch keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WATCH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::WATCH_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/watch-release.jks"
          chmod 600 "$RUNNER_TEMP/watch-release.jks"

      - name: Configure watch signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/watch-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.WATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > watch/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: watch
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          ../android/gradlew assembleRelease --no-daemon --console=plain

      - name: Verify signature and package
        run: |
          set -euo pipefail
          APK=watch/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose "$APK" | grep -q "Verifies"
          "$SDK/aapt2" dump badging "$APK" | grep -q "package: name='dev.rflab.watch'"
          if "$SDK/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::watch release APK is debuggable"
            exit 1
          fi

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#watch-v}"
          APK=watch/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" dist/rf-lab-watch.apk
          cp "$APK" "dist/rf-lab-watch-$VERSION.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish non-latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#watch-v}"
          TITLE="RF-Lab Watch v${VERSION} — OPPO Watch 2 APK"
          gh release create "$TAG" dist/* \
            --title "$TITLE" \
            --notes-file watch/RELEASE_NOTES.md \
            --latest=false \
            --verify-tag
