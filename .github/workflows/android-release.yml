name: Android release APK

# 打标签即发布:git tag v0.6.0 && git push origin v0.6.0
# 需要仓库 Secrets:ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD(见 android/README.md)。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # tag / versionName / 固件版本必须一致,避免 Release 里装出旧版。
      - name: Check tag matches APK and firmware versions
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -n1)
          FW_VERSION=$(python3 - <<'PY'
          import re
          s = open('firmware/platformio.ini', encoding='utf-8').read()
          m = re.search(r'RFLAB_FW_VERSION=\\"([0-9.]+)\\"', s)
          print(m.group(1) if m else '')
          PY
          )
          if [ "$GRADLE_VERSION" != "$VERSION" ] || [ "$FW_VERSION" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME != versionName '$GRADLE_VERSION' / firmware '$FW_VERSION'"
            exit 1
          fi
          echo "tag/APK/firmware = $VERSION"

      # 固件/APK/官网三处资源必须来自同一份 web/,标签上的生成物不能过期。
      - name: Check generated Web assets
        run: python3 tools/build_web.py --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-release-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-release-${{ runner.os }}-

      - name: Install PlatformIO
        run: python3 -m pip install "platformio>=6.1,<7"

      # Release 必须同时附固件:APP 与固件是两条更新链路,不能只发 APK。
      - name: Build firmware
        working-directory: firmware
        run: pio run -e esp32c3

      - name: Import release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Configure signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify signature and package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose "$APK" | grep -q "Verifies"
          "$SDK/aapt2" dump badging "$APK" | grep -q "package: name='dev.rflab.terminal'"

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" dist/rf-lab-android.apk
          cp "$APK" "dist/rf-lab-$VERSION.apk"
          cp firmware/.pio/build/esp32c3/firmware.bin dist/rf-lab-firmware.bin
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          TITLE="RF-Lab v${VERSION} — Android APK + firmware"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file android/RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file android/RELEASE_NOTES.md \
              --verify-tag
          fi
