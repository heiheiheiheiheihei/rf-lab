; RF-Lab 固件构建(RF-Lab 本批:USB-only)
;
; 目标板:VCC-GND YD-ESP32-S3(丝印 HW678),HW-678A 模组 N16R8
;   - 16MB Flash + 8MB PSRAM(八线/Octal)
;   - 控制通道 = ESP32-S3 内建 USB Serial/JTAG(ADR-0003),不接 CH343P
;
; 注意:本文件只描述"怎么编译"。引脚与协议的事实来源是
;   docs/10-hardware/010-system-architecture.md
;   docs/30-protocol/010-device-app-protocol.md

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; 串口(下载/监视)走 USB Serial/JTAG;PIO 上传时用 esptool 的 auto-reset
upload_speed = 921600

build_flags =
    -DRFLAB_FW_VERSION=\"0.1.0\"

; sdkconfig 由 sdkconfig.defaults 生成;sdkconfig 本身不入库
