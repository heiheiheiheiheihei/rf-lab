; RF-Lab 固件构建(RF-Lab 本批:USB-only)
;
; 目标板:VCC-GND YD-ESP32-S3(丝印 HW678),HW-678A 模组 N16R8
;   - 16MB Flash + 8MB PSRAM(八线/Octal)
;   - 控制通道 = **CH343P → UART0**(1a86:55d3),帧协议独占这条流
;
; 🔴 2026-10-21 载体变更(实测驱动,不是偏好):
;   原生 USB Serial/JTAG 在**本板**从未枚举成功 ——
;   2026-10-18:9.4 分钟 / 435 次 connect / 438 次 error -71 / 0 次成功;
;   2026-10-21:换另一个 Type-C 口,150s 内主机侧零 USB 事件。
;   ⇒ 唯一已证实可用的通路是 CH343P(USB-UART 桥,CDC-ACM,VID:PID = 1a86:55d3)。
;   ⚠️ 这意味着 App 侧 WebUSB 过滤器必须从 303a:xxxx 改成 1a86:55d3。
;
; 注意:本文件只描述"怎么编译"。引脚与协议的事实来源是
;   docs/02-hardware.md
;   docs/04-protocol.md

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; L-01:板型 JSON(esp32-s3-devkitc-1)按 **8MB Flash** 定义,而本板是 N16R8(16MB),
;   sdkconfig.defaults 也声明 16MB ⇒ 旧构建每次都有
;   "Warning! Flash memory size mismatch detected. Expected 8MB, found 16MB!"。
;   平台层允许在 env 里覆盖板级 upload 字段,这里显式改成 16MB,
;   让板型/分区表/esptool 三方一致。若上游板型定义变化导致这里失效,
;   改用 16MB 的板级定义(如 esp32-s3-devkitc-1-n16r8)并把这两行删掉。
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; 启动横幅与协议帧都在 921600(同一波特率;横幅是以 '#' 开头的文本,
; 协议解析器在 MAGIC 处同步,但**必须校验 VER 并在失配时重新处理当前字节**,
; 因为横幅/设备 ID 里的 'R'(0x52)本身等于 MAGIC)。
monitor_speed = 921600

; esptool 自动 reset 走 CH343P 的 DTR/RTS;这两个信号也用于"正常启动"。
upload_speed = 921600

build_flags =
    -DRFLAB_FW_VERSION=\"0.2.0\"

; --- bring-up 诊断开关:默认**全部关闭**(L-10)。
; 需要时**手动**在 build_flags 里加一行,定位完立刻删掉。
; ⚠️ 改完 build_flags 后要 `rm -f sdkconfig.esp32s3` 再编译,否则可能沿用旧配置。
;
;   WS2812 上电自检(TC-106 载板正品检查,红→绿→蓝,会让"闪三下"看起来像正常启动):
;     -DRFLAB_LED_SELFTEST=1
;
;   现场接线诊断(启动时输出 '# dbg …' 电气判读;会给 M1 发 POWER_UP 并提前拉高
;   三路 EN,改变上电时序,只用于排障 —— 见 src/wire_diag.h):
;     -DRFLAB_WIRE_DEBUG=1

; 可选:需要完整 IDF 日志时,取消下面两行并同时把 sdkconfig.defaults 里的
; CONFIG_ESP_CONSOLE_NONE/CONFIG_LOG_DEFAULT_LEVEL_NONE 改回去。
; 代价:日志会与控制协议抢 UART0,只能用于纯排障,不能同时跑协议。
;   -DRFLAB_DEBUG_CONSOLE=1

; sdkconfig 由 sdkconfig.defaults 生成;sdkconfig 本身不入库
