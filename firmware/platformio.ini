; RF-Lab — ESP32-C3 OLED + YS-RF34DL(315/433 编解码模块)
;
; 板:ESP32-C3 0.42" OLED(SSD1306 72×40,SDA=GPIO5 / SCL=GPIO6;原生 USB;4MB Flash)
;     OLED 由本版驱动,只做状态面板(I2C,0x3C,400kHz 失败回退 100kHz)。
; 模块:UART1,9600 8N1,TX=GPIO3(ESP→模块 RXD),RX=GPIO4(模块 TXD→ESP)
; 控制台:原生 USB-Serial-JTAG + UART0(GPIO20/21),115200 8N1,双通道都收发。
; 0.6.0:Wi-Fi APSTA + HTTP/SSE Web UI + NimBLE。
; 0.7.1:码库 v2(名称/分组/符号/原始参数)+ APP 0.7.1;规格 docs/01-ui.md §5.4。

[env:esp32c3]
; 锁版本:CI 首次跑拉到 8.0.0,它的 EMBED_FILES 在 PlatformIO 下把相对 build_dir
; 拼成双路径(.pio/build/esp32c3/.pio/build/esp32c3/index.html.gz.S),构建失败。
; 7.1.3 是最近一个稳定版,ESP-IDF 与本地 5.5.x 同代;升级平台要显式改这一行。
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = espidf

board_upload.flash_size = 4MB
; PlatformIO 自己也会生成 partitions.bin;不写这一行它会用 1MB 默认表,
;把 sdkconfig 里的 2MB 自定义表覆盖掉(0.6.0 实测踩过)。
board_build.partitions = partitions.csv
board_upload.maximum_size = 4194304

monitor_speed = 115200
upload_speed = 460800

; 先把 web/ 单页构建进 src/web/index.html.gz,CMake 再 EMBED_FILES。
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/check_partitions.py

build_flags =
    -DRFLAB_FW_VERSION=\"0.7.2\"
